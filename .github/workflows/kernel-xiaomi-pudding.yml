name: 小米 pudding SukiSU Ultra GKI

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "SukiSU Ultra 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Latest(最新)
          - Custom(自定义)
        default: Latest(最新)
      custom_ref:
        description: "自定义引用，仅在分支选择 Custom(自定义) 时使用"
        required: false
        type: string
        default: ""
      version:
        description: "自定义版本名，留空使用默认命名"
        required: false
        type: string
        default: "pudding-android16-6.12.23-sukisu"
      build_time:
        description: "自定义构建时间，N 或留空表示当前 UTC"
        required: false
        type: string
        default: "N"
      enable_susfs:
        description: "启用 SUSFS"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM 功能"
        required: false
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: false
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: false
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      virtualization_support:
        description: "虚拟化支持"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"

jobs:
  build-pudding-sukisu-ultra:
    name: "pudding android16 6.12.23 SukiSU Ultra"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: "23"
      os_patch_level: "2025-06"
      ksu_variant: "SukiSU"
      ksu_branch: ${{ inputs.ksu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: false
      zram_full_algo: false
      zram_extra_algos: ""
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      enable_susfs: ${{ inputs.enable_susfs }}
      virtualization_support: ${{ inputs.virtualization_support }}
      upload_aux_artifacts: true

  get-sukisu-manager:
    name: 获取 SukiSU Ultra 管理器
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: "SukiSU"
      ksu_branch: ${{ inputs.ksu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
